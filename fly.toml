# Fly deployment — the full-fidelity host (docs/vercel-deploy.md names
# Fly for always-on FastAPI + WebSockets + disk).
app = "ml-teacher-tutor"
primary_region = "dfw"

[build]

[env]
  ML_TEACHER_DATA_DIR = "/data"
  MULTI_USER_SHEETS = "1"

[[mounts]]
  source = "ml_teacher_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # "suspend" preserves machine MEMORY across idle sleeps — in-memory
  # chat sessions survive and resume in <1s. "stop" cold-booted mid-
  # conversation on 2026-08-07 (proxy autostopped between chat turns;
  # the learner's session vanished and the chat reset on them).
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
