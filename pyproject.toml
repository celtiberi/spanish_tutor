[project]
name = "ml-teacher"
version = "0.1.0"
description = "Pedagogy-first AI tutor: teaching-policy prompt + course-pack grounding (Phase 2 vertical slice)"
requires-python = ">=3.10"
dependencies = ["anthropic>=0.92"]

[project.scripts]
tutor = "tutor.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tutor"]
